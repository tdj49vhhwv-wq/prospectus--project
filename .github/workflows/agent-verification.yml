name: Agent verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core dependencies
        run: bash scripts/setup_agent_env.sh
      - name: Run tests and functional verification
        run: .venv/bin/python scripts/verify_agent_workflow.py
